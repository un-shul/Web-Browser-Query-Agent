[pytest]
# `python -m pytest` puts the current directory on sys.path; the `pytest`
# console script does not. Without this, the suite passed locally under the
# former and failed in CI under the latter with "No module named
# 'queryagent'". Setting it here makes every invocation behave the same.
pythonpath = .
testpaths = tests
addopts = -q

# Deliberately pytest.ini rather than pyproject.toml: Vercel reads
# pyproject.toml to resolve dependencies, and adding one that declares none
# risks it being preferred over requirements.txt at build time.
